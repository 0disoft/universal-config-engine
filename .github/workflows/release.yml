name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate, such as v0.6.0 or v1.0.0-rc.1"
        required: true
        type: string
      dry_run:
        description: "Validate and dry-run publish without writing GitHub release assets or npm packages"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          dry_run="false"
          checkout_ref="$tag_name"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="${{ inputs.tag }}"
            checkout_ref="$tag_name"
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              dry_run="true"
              checkout_ref="$GITHUB_SHA"
            fi
          fi

          if [[ ! "$tag_name" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be an exact stable or prerelease semantic version: $tag_name" >&2
            exit 1
          fi

          version="${tag_name#v}"
          prerelease="false"
          npm_tag="latest"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
            npm_tag="next"
          fi

          {
            echo "tag_name=$tag_name"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "npm_tag=$npm_tag"
            echo "dry_run=$dry_run"
            echo "checkout_ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert release package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { parseReleaseVersion } from "./scripts/release-version.mjs";
          import { WORKSPACE_PACKAGE_NAMES, packageDirectory } from "./scripts/lib/workspace-packages.mjs";

          const releaseVersion = process.env.RELEASE_VERSION;
          parseReleaseVersion(releaseVersion);
          const mismatches = WORKSPACE_PACKAGE_NAMES.flatMap((name) => {
            const path = `packages/${packageDirectory(name)}/package.json`;
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            return manifest.version === releaseVersion
              ? []
              : [`${manifest.name} has version ${manifest.version}, expected ${releaseVersion}`];
          });

          if (mismatches.length > 0) {
            console.error(mismatches.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Verify stable release candidate
        id: candidate_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          node scripts/check-stable-release-readiness.mjs
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"
          --preparation-sha "$(git rev-parse HEAD)"

      - name: Assert release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [[ ! -s "$notes_file" ]]; then
            echo "Missing or empty release notes: $notes_file" >&2
            exit 1
          fi
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Run repository check
        run: pnpm run check

      - name: Smoke workspace packages
        run: pnpm run smoke:packages

      - name: Smoke stable candidate registry packages
        if: steps.candidate_gate.outputs.required == 'true'
        env:
          RELEASE_VERSION: ${{ steps.candidate_gate.outputs.candidate_version }}
        run: pnpm run smoke:registry-packages

      - name: Check repository diff hygiene
        run: git diff --check

      - name: Build release tarballs
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm -r build
          mkdir -p .tmp/release
          node --input-type=module <<'NODE'
          import { statSync } from "node:fs";
          import { WORKSPACE_PACKAGE_NAMES, packageTarballName } from "./scripts/lib/workspace-packages.mjs";
          import { runPnpm } from "./scripts/lib/package-tools.mjs";

          for (const name of WORKSPACE_PACKAGE_NAMES) {
            runPnpm(["--filter", name, "pack", "--pack-destination", ".tmp/release"]);
            const tarball = `.tmp/release/${packageTarballName(name, process.env.RELEASE_VERSION)}`;
            if (statSync(tarball).size === 0) throw new Error(`Empty release tarball: ${tarball}`);
          }
          NODE

      - name: Record publication state before publish
        id: publication_before
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          state_file=".tmp/release/publication-state-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-before.json"
          node scripts/record-publication-state.mjs \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --phase before \
            --output "$state_file"
          echo "state_file=$state_file" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub release assets
        if: steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.path }}
          PUBLICATION_STATE_FILE: ${{ steps.publication_before.outputs.state_file }}
        run: node scripts/prepare-release-assets.mjs

      - name: Publish npm packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          PUBLICATION_STATE_FILE: ${{ steps.publication_before.outputs.state_file }}
        shell: bash
        run: |
          set -euo pipefail
          npm ping --registry=https://registry.npmjs.org/

          package_entries="$(node --input-type=module -e '
            import { WORKSPACE_PACKAGE_NAMES, packageTarballName } from "./scripts/lib/workspace-packages.mjs";
            for (const name of WORKSPACE_PACKAGE_NAMES) {
              console.log(`${name}|.tmp/release/${packageTarballName(name, process.env.RELEASE_VERSION)}`);
            }
          ')"
          mapfile -t packages <<< "$package_entries"

          for entry in "${packages[@]}"; do
            package_name="${entry%%|*}"
            tarball="${entry##*|}"

            publication_action="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { getPublicationAction } from "./scripts/record-publication-state.mjs";
              const manifest = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const entry = manifest.packages.find((candidate) => candidate.name === process.argv[2]);
              process.stdout.write(getPublicationAction(entry?.status, process.argv[3] === "true"));
            ' "$PUBLICATION_STATE_FILE" "$package_name" "$DRY_RUN")"
            if [[ "$publication_action" == "inspect" ]]; then
              echo "Inspecting tarball for already published package ${package_name}@${RELEASE_VERSION} (dry-run)"
              npm pack "$tarball" --dry-run --ignore-scripts --json
              continue
            fi
            if [[ "$publication_action" == "skip" ]]; then
              echo "Skipping already published package ${package_name}@${RELEASE_VERSION}"
              continue
            fi

            publish_args=(publish "$tarball" --access public --provenance --tag "$NPM_TAG" --registry=https://registry.npmjs.org/)
            if [[ "$DRY_RUN" == "true" ]]; then
              publish_args+=(--dry-run)
            fi

            npm "${publish_args[@]}"
          done

      - name: Verify published npm packages
        if: steps.release.outputs.dry_run != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm run verify:registry-packages

      - name: Smoke published registry packages
        if: steps.release.outputs.dry_run != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm run smoke:registry-packages

      - name: Record publication state after publish
        if: always() && steps.release.outputs.dry_run != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          state_file=".tmp/release/publication-state-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-after.json"
          node scripts/record-publication-state.mjs \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --phase after \
            --output "$state_file"

      - name: Preserve publication evidence
        if: always() && steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(.tmp/release/publication-state-*.json)
          if [[ "${#manifests[@]}" -eq 0 ]]; then
            echo "No publication state manifests were produced." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${manifests[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
